<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNest | Cart</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">ShopNest</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Categories</a>
            <a href="#">Offers</a>
        </div>

        <div class="search-wrap">
            <input type="text" placeholder="Search products..." aria-label="Search products">
        </div>

        <div class="nav-buttons">
            <a href="cart.html">🛒 Cart</a>
            <a href="wishlist.html">♡ Wishlist</a>
            <a href="auth.html">Login</a>
        </div>
    </nav>

    <main class="cart-page">
        <section class="cart-layout">
            <div class="cart-items-panel">
                <div class="section-heading compact-heading">
                    <p>Shopping cart</p>
                    <h2>Your Cart</h2>
                </div>

                <div id="cart-items"></div>
            </div>

            <aside class="cart-summary">
                <h3>Order Summary</h3>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span id="cart-shipping">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Price savings</span>
                    <span id="cart-discount">-₹0</span>
                </div>

                <div class="summary-total">
                    <span>Total</span>
                    <span id="cart-total">₹0</span>
                </div>

                <a class="checkout-btn checkout-link" href="checkout.html">Proceed to Checkout</a>
            </aside>
        </section>
    </main>

    <script src="../js/products.js"></script>
</body>

</html>
